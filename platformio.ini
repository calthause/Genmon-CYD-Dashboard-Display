[platformio]
default_envs = esp32dev

[env:esp32dev]
; ESP32 Dev Board with CYD Display
platform = espressif32@5.4.0
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 460800

lib_deps =
    lovyan03/LovyanGFX @ ^1.1.16
    tzapu/WiFiManager @ ^2.0.17
    bblanchon/ArduinoJson @ ^7.0.4

; CYD Panel dimensions
build_flags =
    -DBOARD_CYD
    -DCYD_PANEL_W=240
    -DCYD_PANEL_H=320
